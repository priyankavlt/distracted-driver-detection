[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddd"
version = "2.0.0"
description = "Distracted driver detection on the State Farm dataset (PyTorch)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
app = ["gradio>=4"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
